include-file = $HOME/.config/polybar/include-modules.ini

[bar/example]
width = 100%
height = 30

dpi = 95

font-0 = "ComicShannsMono Nerd Font:size=14:weight=regular;2"

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

background = ${colors.semi-trans}
foreground = ${colors.fg}

tray-background = ${colors.bg-alt}
tray-padding = 2
tray-position = right
tray-maxsize = 16

modules-left = i3
modules-right = pomodoro cpu memory pulseaudio xbacklight date

[settings]
screenchange-reload = true
pseudo-transparency = true
