include-file = $HOME/.config/polybar/include-modules.ini

[bar/example]
width = 100%
height = 25

dpi = 100

; font-0 = "Maple Mono NF:size=20:weight=bold;3"
; font-0 = "ComicShannsMono Nerd Font:size=14:weight=regular;2"
; font-0 = "Maple Mono NF CN Medium:size=12:weight=regular;2"
font-0 = "Ioskeley Mono Medium:size=12:weight=regular;2"
font-1 = "Maple Mono NF CN Medium:size=12:weight=regular;2"
; font-1 = "ComicShannsMono Nerd Font Propo:size=14:weight=Bold;2"

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; background = ${colors.semi-trans}
background = #00000000
foreground = ${colors.fg}

; tray-background = ${colors.bg-alt}
; tray-background = #00000000
; tray-padding = 2
; tray-position = right
; tray-maxsize = 16

modules-left = i3 
modules-right = pomodoro cpu memory pulseaudio xbacklight wlan battery date

[settings]
screenchange-reload = true
pseudo-transparency = true
