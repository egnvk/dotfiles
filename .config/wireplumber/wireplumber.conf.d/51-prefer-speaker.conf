monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*__HDMI.*" }
    ]
    actions = {
      update-props = {
        priority.driver = 100
        priority.session = 100
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*__Speaker__.*" }
    ]
    actions = {
      update-props = {
        priority.driver = 2500
        priority.session = 2500
      }
    }
  }
]
