monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic" }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = true
        api.acp.auto-port = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*__HDMI.*" }
    ]
    actions = {
      update-props = {
        priority.driver = 100
        priority.session = 100
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*__Speaker__.*" }
    ]
    actions = {
      update-props = {
        priority.driver = 2500
        priority.session = 2500
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*__Headphones__.*" }
    ]
    actions = {
      update-props = {
        priority.driver = 3000
        priority.session = 3000
      }
    }
  }
]

wireplumber.components = [
  {
    name = /home/egn/.config/wireplumber/scripts/auto-switch-profile.lua
    type = script/lua
    provides = hooks.auto-switch-profile
  }
]

wireplumber.profiles = {
  main = {
    hooks.auto-switch-profile = required
  }
}
