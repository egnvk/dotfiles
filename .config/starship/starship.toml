# Sets user-defined palette
# Palettes must be defined _after_ this line
# palette = "catppuccin_macchiato"
palette = "monochrome"
# palette = "gruvbox_dark"

format = """$username \
$os\
$directory\
$all"""

[battery]
full_symbol = "• "
charging_symbol = "⇡ "
discharging_symbol = "⇣ "
unknown_symbol = "❓ "
empty_symbol = "❗ "

[username]
style_user = "bold sapphire"
style_root = "bold red"
format = "[$user]($style)"
show_always = true

[os]
style = "blue"
disabled = false

[os.symbols]
Arch = " "

[directory]
style = "bold sky"
truncation_length = 3
truncate_to_repo = true

[character]
success_symbol = "[❯](bold teal)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[](bold yellow)"
vimcmd_replace_one_symbol = "[](bold peach)"
vimcmd_replace_symbol = "[](bold peach)"
vimcmd_visual_symbol = "[](bold mauve)"

[package]
disabled = true

[erlang]
symbol = "ⓔ "

# [nodejs]
# symbol = "[⬢](bold green) "

[pulumi]
symbol = "🧊 "

[typst]
symbol = "t "

